---
services:
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    hostname: alloy.gg
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./certs/example.crt:/etc/certs/example.crt
      - ./config/config.alloy:/etc/alloy/config.alloy
      - alloy_data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /run:/run:ro
      - /var/log:/var/log:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker/:ro
      - /run/udev/data:/run/udev/data:ro
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - customnet
  grafana:
    image: docker.io/grafana/grafana-oss:12.1.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - customnet
  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    command: "-config.file=/etc/loki/config.yaml"
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/config.yaml:ro
      - loki_data:/loki:rw
    restart: unless-stopped
    networks:
      - customnet

  testapp:
    container_name: testapp
    build:
      context: ./testapp
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - alloy
    labels:
      - alloy.enabled=true
      - alloy.service.name=testapp
    networks:
      - customnet
  
  proxy:
    image: nginx:alpine
    container_name: proxy
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    ports:
      - "8081:443"
    networks:
      - customnet
    depends_on:
      - loki
        

volumes:
  alloy_data:
  loki_data:
  grafana_data:

networks:
  customnet:
    driver: bridge
