events {}

http {
    server_tokens off;

    server {
        listen 443 default_server ssl;

        ssl_certificate /etc/nginx/certs/example.crt;
        ssl_certificate_key /etc/nginx/certs/example.key;
        
        location / {
            proxy_pass http://loki:3100;
            proxy_http_version 1.1;
        }
    }
}
