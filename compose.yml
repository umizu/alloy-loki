services:
  testapp:
    container_name: testapp
    build:
      context: ./testapp
      dockerfile: Dockerfile
    ports:
      - "9050:9050"
    labels:
      - alloy.enabled=true
      - alloy.service.name=testapp
    networks:
      - customnet
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    hostname: alloy.gg
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./certs/alloy.crt:/etc/certs/alloy.crt:ro
      - ./certs/alloy.key:/etc/certs/alloy.key:ro
      - ./certs/example-root.crt:/etc/certs/example-root.crt:ro
      - ./config/config.alloy:/etc/alloy/config.alloy
      - alloy_data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /run:/run:ro
      - /var/log:/var/log:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker/:ro
      - /run/udev/data:/run/udev/data:ro
    restart: on-failure
    networks:
      - customnet
    depends_on:
      - loki
  proxy:
    image: nginx:alpine
    container_name: proxy
    volumes:
      - ./certs/example-root.crt:/etc/nginx/certs/example-root.crt:ro
      - ./certs/proxy.crt:/etc/nginx/certs/proxy.crt:ro
      - ./certs/proxy.key:/etc/nginx/certs/proxy.key:ro
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "443"
    networks:
      - customnet
    depends_on:
      - loki
  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    command: "-config.file=/etc/loki/config.yaml"
    ports:
      - "3100"
    volumes:
      - ./config/loki.yml:/etc/loki/config.yaml:ro
      - loki_data:/loki:rw
    networks:
      - customnet
  grafana:
    image: docker.io/grafana/grafana-oss:12.1.1
    container_name: grafana
    ports:
      - "9051:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - customnet

volumes:
  alloy_data:
  loki_data:
  grafana_data:

networks:
  customnet:
    driver: bridge
